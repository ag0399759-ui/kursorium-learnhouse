name: Deploy to Railway

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ag0399759-ui/kursorium-web

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:dev
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Find correct Railway deploy mutation
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          IMAGE="ghcr.io/${{ env.IMAGE_NAME }}:dev"
          echo "Image to deploy: $IMAGE"

          # Update Railway service source to Docker image
          UPDATE=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"query\":\"mutation { serviceInstanceUpdate(input: { source: { image: \\\"$IMAGE\\\" } }, environmentId: \\\"1deef1af-6e6c-4a12-a5d1-34e9f7558938\\\", serviceId: \\\"978eeedb-ae4b-4b1e-890a-f0b47e00b508\\\") }\"}")
          echo "Update source: $UPDATE"

          sleep 10

          # List all mutations with 'deploy' or 'image' in name
          MUTS=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ __type(name: \"Mutation\") { fields { name } } }"}')
          echo "$MUTS" | grep -o '"name":"[^"]*deploy[^"]*"' | head -20
          echo "$MUTS" | grep -o '"name":"[^"]*Deploy[^"]*"' | head -20

          # Verify current source
          SOURCE=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"{ serviceInstance(environmentId: \"1deef1af-6e6c-4a12-a5d1-34e9f7558938\", serviceId: \"978eeedb-ae4b-4b1e-890a-f0b47e00b508\") { source { image repo } } }"}')
          echo "Current source: $SOURCE"

          # Try serviceInstanceRedeploy after source update + sleep
          REDEPLOY=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"1deef1af-6e6c-4a12-a5d1-34e9f7558938\", serviceId: \"978eeedb-ae4b-4b1e-890a-f0b47e00b508\") }"}')
          echo "Redeploy: $REDEPLOY"
          echo "Done: $IMAGE"
