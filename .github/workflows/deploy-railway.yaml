name: Deploy to Railway

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/kursorium-web

jobs:
  build-and-deploy:
    name: Build Docker Image & Deploy to Railway
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Update Railway service image & Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="ghcr.io/ag0399759-ui/kursorium-web:sha-${SHORT_SHA}"
          echo "Target image: $IMAGE_TAG"

          # Check current service source
          echo "--- Current source BEFORE update ---"
          curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw '{"query":"{ serviceInstance(environmentId: \"1deef1af-6e6c-4a12-a5d1-34e9f7558938\", serviceId: \"978eeedb-ae4b-4b1e-890a-f0b47e00b508\") { id source { image repo } } }"}' | python3 -c "import sys,json; d=json.load(sys.stdin); si=d['data']['serviceInstance']['source']; print('image:', si.get('image'), '| repo:', si.get('repo'))"

          # Update service source to Docker image (clear repo, set image)
          echo "--- Updating source to Docker image ---"
          UPDATE=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw "{\"query\":\"mutation { serviceInstanceUpdate(input: { source: { image: \\\"${IMAGE_TAG}\\\" } }, environmentId: \\\"1deef1af-6e6c-4a12-a5d1-34e9f7558938\\\", serviceId: \\\"978eeedb-ae4b-4b1e-890a-f0b47e00b508\\\") }\"}")
          echo "Update result: $UPDATE"

          # Verify source AFTER update
          echo "--- Source AFTER update ---"
          curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw '{"query":"{ serviceInstance(environmentId: \"1deef1af-6e6c-4a12-a5d1-34e9f7558938\", serviceId: \"978eeedb-ae4b-4b1e-890a-f0b47e00b508\") { id source { image repo } } }"}' | python3 -c "import sys,json; d=json.load(sys.stdin); si=d['data']['serviceInstance']['source']; print('image:', si.get('image'), '| repo:', si.get('repo'))"

          # Trigger redeploy
          echo "--- Triggering redeploy ---"
          REDEPLOY=$(curl -sf -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-raw '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"1deef1af-6e6c-4a12-a5d1-34e9f7558938\", serviceId: \"978eeedb-ae4b-4b1e-890a-f0b47e00b508\") }"}')
          echo "Redeploy: $REDEPLOY"
          echo "✅ Done: $IMAGE_TAG"

